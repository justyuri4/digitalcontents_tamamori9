<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハイパー会話レコーダー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>ハイパー会話レコーダー</h1>
      <p class="lead">会話の内容から、決まらなかったことへの解決案を考えます。</p>
    </header>

    <section class="panel" aria-labelledby="input-heading">
      <h2 id="input-heading">会話の内容</h2>
      <p class="help">音声を入力し、必要なら変更を加えてください。</p>
      <textarea id="transcript" placeholder="例：\n田中：新しい企画を来月から始めたいです。\n佐藤：準備の時間が足りるか心配です。\n田中：まずは小さく始めて、様子を見るのはどうでしょう？">
[
  {
    "topic": "「ねえ、昨日教えてもらったあの駅前のカフェ、さっそく行ってみたよ。」
「本当？どうだった？あそこ、雰囲気も落ち着いてて居心地いいでしょ。」
「うん、すごく良かった！特に季節限定の栗のタルトが絶品だったよ。」
「あのタルト食べたんだ！生地がサクサクで美味しいよね、私も大好き。」
「そうそう！秋の味覚を満喫できたよ。秋といえば、そろそろ紅葉のシーズンだね。」
「京都の紅葉、今年こそ見に行きたいなと思って調べてるんだ。」
「いいね！京都の秋は混むけど、やっぱり景色の綺麗さが段違いだよね。」
「清水寺とか嵐山あたりをのんびり散策するのが夢なんだよね。」",
    "analysis": "【要約】
会話では、駅前のカフェでの栗のタルトの美味しさや、秋の紅葉を見に京都に行きたいという話が交わされた。

【決定事項】
- なし

【未決事項・課題】
- 京都の紅葉を見に行く計画

【提案】
- 京都の紅葉を見に行くための具体的な日程やプランを調べること"
  },
  {
    "topic": "「ライトアップされる夜の寺院も幻想的で絶対おすすめだよ。」
「夜のライトアップも素敵そう！あ、京都といえば、新幹線のチケットって今スマホで簡単に買えるんだね。」
「そうなんだよ、アプリで席まで選んで予約できるから本当に便利になったよね。」
「改札もスマホをタッチするだけで通れるから、切符を無くす心配もないし。」
「前は駅のみどりの窓口に並んで買ってたから、時代の変化を感じるよ。」
「本当だよね。スマホといえば、昨日OSをアップデートしたら画面のデザインがガラッと変わっちゃって。」
「わかる！アップデート後のアイコンの配置とか操作感に慣れるまで時間かかるよね。」
「そうなの、通知の表示方法も変わってて朝からずっと戸惑ってるよ。」
「設定画面から前のデザインに近いレイアウトに戻せることもあるみたいだけど、試した？」
「えっ、戻せるの？後でやり方教えてほしいな、デジタル機器は本当苦手で。」
「任せて、後で画面見ながらやってみよう。電子機器の進化って早すぎてついていけないよね。」
「この前なんて、最新のロボット掃除機が部屋の隅で迷子になって動けなくなってたよ。」
「ええ、ロボット掃除機が迷子に？なんかポンコツっぽくて可愛いね。」
「そうなの、助けを求めるみたいにピピッて鳴いてて思わず笑っちゃった。」
「なんだかペットを飼ってるみたいな愛着が湧いてきそうだね。」
「まさにそれ！ペットといえば、昔実家で柴犬を飼ってたのを思い出したよ。」
「柴犬飼ってたんだ！可愛いよね、やっぱり毎日散歩に行ったりしてたの？」
「うん、朝と夕方の2回行ってたんだけど、雨の日も風の日もだから結構大変だったよ。」
「天気が悪い日の散歩は一苦労だよね、でも犬にとっては大事な時間だし。」
「そうだね、でも今思うと良い運動習慣になってたのかなって思うよ。」
「確かに！犬の散歩ってバカにできない運動量になるよね。」
「そうなの。最近めっきり運動不足だから、毎朝ランニングでも始めようかなって思ってるんだ。」
「朝ランいいね！朝の新鮮な空気を吸いながら走ると頭もすっきりしそう。」
「形から入るタイプだから、まずは走りやすいランニングシューズを買おうかな。」
「お気に入りのウェアやシューズを揃えるとモチベーション上がるよね！」
「形を整えて毎朝走る習慣をつけたいな。毎朝といえば、最近朝食をオートミールに変えたんだ。」
「へえ、オートミール！健康志向だね。やっぱりダイエットとか意識して？」
「それもあるし、食物繊維が豊富で健康に良いって聞いたから試してみたくて。」 / 「味はどう？正直あんまり味がなくて続けにくいイメージがあるんだけど。」
「和風のだしでお粥みたいにして食べるとすごく美味しいし、腹持ちが良いよ。」
「だしでお粥風か、それなら美味しそう！食べてみたいな。」
「オートミールって海外だと定番の朝食らしくて、色んなレシピがあるみたい。」",
    "analysis": "【要約】
会話では、夜の寺院のライトアップやスマホでの新幹線チケット購入の便利さ、デジタル機器の進化、犬の散歩や運動不足について話し合われた。特に、オートミールへの食事変更が健康志向の一環として取り上げられた。

【決定事項】
- なし

【未決事項・課題】
- 毎朝のランニングを始めること

【提案】
- ランニングシューズを購入し、朝の運動習慣をつけること
【要約】
会話では、オートミールの味についての意見が交わされ、和風のだしを使ったお粥風の食べ方が美味しいと紹介された。オートミールが海外で定番の朝食であることも言及された。

【決定事項】
- なし

【未決事項・課題】
- オートミールの具体的な食べ方やレシピについての検討

【提案】
- 和風のだしを使ったお粥風のレシピを試してみること"
  },
  {
    "topic": "「海外といえば、パスポートの期限が来月で切れるのを思い出して焦ってるよ。」
「来月！？それは早く更新手続きに行かないとマズいんじゃない？」
「そうなの、年末に海外旅行に行こうか迷ってて、ふと確認したらギリギリだった。」
「申請してから新しいパスポートを受け取るまで1週間くらいかかるから気をつけてね。」
「写真も撮り直さなきゃいけないし、平日に有休取ってパスポートセンター行かなきゃ。」
「手続きって書類揃えたりで面倒だけど、旅行のためと思えば頑張れるね！」
「うん、早めに行ってくるよ。面倒といえば、年末の reflective な大掃除も今から憂鬱だな。」
「もう大掃除の話題が出る時期かぁ。一年って本当にあっという間だね。」
「毎年ギリギリになってから慌てて掃除するから、今年こそ計画的に進めたいよ。」
「まずは不用品を捨てる断捨離から始めると、部屋がすっきりして掃除しやすいよ。」
「確かに！着てない服とか読まない本が溜まってるから、今週末に処分してみる。」
「計画的に進められれば、年末年始はゆっくり羽を伸ばして過ごせそうだね。」
「うん！大掃除をスッキリ終わらせて、気持ちよく来年の目標を立てたいな。」",
    "analysis": "【要約】
パスポートの期限が迫っていることから、更新手続きの重要性が話し合われ、年末の大掃除についても計画的に進めたいという意向が示された。

【決定事項】
- パスポートの更新手続きを早めに行うこと。

【未決事項・課題】
- 大掃除の具体的な計画。

【提案】
- 不用品の断捨離を今週末に行うこと。"
  }
]
</textarea>
      <div class="voice-inputs">
        <button class="voice-button" id="mic-button" type="button"><span class="mic-icon">🎙</span><span><strong>録音を開始</strong><small>このMacのマイクを使用</small></span></button>
        <label class="file-button"><span class="file-icon">♫</span><span><strong>音声ファイル</strong><small>WAV・MP3・M4Aなど / 25MBまで</small></span><input id="audio-file" type="file" accept="audio/*,video/mp4,video/webm" aria-label="音声ファイルを選択"></label>
      </div>
      <p id="recording-status" class="recording-status" aria-live="polite">サーバーに接続しています…</p>
      <p id="file-status" class="file-status" aria-live="polite"></p>
      <div class="controls">
        <button id="load-sample" class="secondary">サンプルを入力</button>
        <button id="clear-text" class="secondary">クリア</button>
        <button id="generate" class="primary">解決案を考える</button>
      </div>
    
    </section>

    <section id="results" class="panel results hidden" aria-live="polite">
      <h2>解決案</h2>
      <p id="result-summary" class="help"></p>
      <div id="suggestion-list"></div>
    </section>
    <footer>ハイパー会話レコーダー</footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
