<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハイパー会話レコーダー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>ハイパー会話レコーダー</h1>
      <p class="lead">会話の内容から、決まらなかったことへの解決案を考えます。</p>
    </header>

    <section class="panel" aria-labelledby="input-heading">
      <h2 id="input-heading">会話の内容</h2>
      <p class="help">音声を入力し、必要なら変更を加えてください。</p>
      <div class="conversation-columns">
        <div class="conversation-column">
          <h3>文字起こし</h3>
          <textarea id="transcript" placeholder="例 &#10;小坂：新しい企画を来月から始めたいです。&#10;井手：準備の時間が足りるか心配です。&#10;小坂：まずは小さく始めて、様子を見るのはどうでしょう？"></textarea>
        </div>
        <div class="conversation-column">
          <h3>GPT APIからの出力</h3>
          <textarea id="gpt-response" placeholder="GPT APIからの出力がここに表示されます。">
          </textarea>
        </div>
      </div>
      <label class="speaker-count-label" for="speaker-count">話す人数（録音・音声ファイル処理前）</label>
      <input id="speaker-count" class="speaker-count" type="number" min="1" max="20" value="2">
      <div class="voice-inputs">
        <button class="voice-button" id="mic-button" type="button"><span class="mic-icon">🎙</span><span><strong>録音を開始</strong><small>このMacのマイクを使用</small></span></button>
        <label class="file-button"><span class="file-icon">♫</span><span><strong>音声ファイル</strong><small>WAV・MP3・M4Aなど / 25MBまで</small></span><input id="audio-file" type="file" accept="audio/*,video/mp4,video/webm" aria-label="音声ファイルを選択"></label>
      </div>
      <p id="recording-status" class="recording-status" aria-live="polite">サーバーに接続しています…</p>
      <div id="speaker-name-editor" class="speaker-name-editor hidden">
        <h3>話者名を変更</h3>
        <p class="help">録音後、「話者1」などを人物名に変更して保存できます。</p>
        <div id="speaker-name-fields"></div>
        <button id="save-speaker-names" class="secondary" type="button">人物名を保存</button>
        <p id="speaker-name-status" aria-live="polite"></p>
      </div>
      <p id="file-status" class="file-status" aria-live="polite"></p>
      <div class="controls">
        <button id="load-sample" class="secondary">サンプルを入力</button>
        <button id="clear-text" class="secondary">クリア</button>
        <button id="generate" class="primary">解決案を考える</button>
      </div>
    
    </section>

    <section id="results" class="panel results hidden" aria-live="polite">
      <h2>解決案</h2>
      <p id="result-summary" class="help"></p>
      <div id="suggestion-list"></div>
    </section>
    <footer>ハイパー会話レコーダー</footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
